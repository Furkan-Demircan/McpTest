version: '3.8'

services:
  # PostgreSQL Veritabanı
  postgres:
    image: postgres:16-alpine
    container_name: usermanagement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usermanagement_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-usermanagement_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # .NET Clean Architecture Backend API
  backend:
    build:
      context: ./server
      dockerfile: src/API/Dockerfile
    container_name: usermanagement_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_started
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-usermanagement_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgrespassword}
      # DeepSeek AI Entegrasyonu (.env ortam değişkenleri)
      - DeepSeek__ApiKey=${DEEPSEEK_API_KEY:-}
      - DeepSeek__BaseUrl=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/}
      - DeepSeek__Model=${DEEPSEEK_MODEL:-deepseek-chat}
      - Mcp__ServerUrl=http://mcp:8080/mcp
    networks:
      - app-network

  # Model Context Protocol (MCP) Server
  mcp:
    build:
      context: ./server
      dockerfile: src/MCP/Dockerfile
    container_name: usermanagement_mcp
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
