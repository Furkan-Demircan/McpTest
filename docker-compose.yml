version: '3.8'

services:
  # PostgreSQL Veritabanı
  postgres:
    image: postgres:16-alpine
    container_name: usermanagement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: usermanagement_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usermanagement_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # .NET Clean Architecture Backend API
  backend:
    build:
      context: ./server
      dockerfile: src/API/Dockerfile
    container_name: usermanagement_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=usermanagement_db;Username=postgres;Password=postgrespassword
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
